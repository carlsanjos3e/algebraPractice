<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algebra Practice: Linear Equations</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-zB1R0rpPzHqg7r+ByEhJkxaPK+5npujYzZMOIPV+gp7jA4t4+/LNqvVbLr9C7a0f" crossorigin="anonymous">

    <script>
         document.addEventListener("DOMContentLoaded", function() {
             renderMathInElement(document.body, {
                 // Only render static math delimiters here
                 delimiters: [
                     {left: '$$', right: '$$', display: true},
                     {left: '$', right: '$', display: false},
                     {left: '\\(', right: '\\)', display: false},
                     {left: '\\[', right: '\\]', display: true}
                 ],
                 throwOnError : false
             });
         });
     </script>
</head>
<body>

    <div class="container">
        <h1>Practice Solving Linear Equations</h1>

        <div class="controls">
            <button id="generate-btn">Generate New Equation</button>
        </div>

        <div class="problem-area">
            <p>Solve for x:</p>
             <div id="equation-display"></div>
        </div>

        <div id="answer-input-area">
             <label for="user-answer">\( x = \)</label>
             <input type="text" id="user-answer" autocomplete="off">
             <button id="check-answer-btn">Check Answer</button>
        </div>

        <div id="feedback-area" class="hidden">
            <p id="feedback-text"></p>
        </div>

        <div id="correct-answer-area" class="hidden">
             <p>Correct Answer: \( x = \) <span id="correct-answer-display"></span></p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-vmqqovengx4wPujLBFZFkmL7DBY+HtBxKntjiV7eOatBmoVC/vsVgkrLCx/Ui2I9" crossorigin="anonymous"></script>

    <script src="script.js"></script>

</body>
</html>
